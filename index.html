<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a10">
  <meta name="description" content="Explore every CyberPets tank, creature, and bundle in motion. A visual preview catalog for the Living Aquarium collection.">
  <title>CyberPets · Preview collection</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./site.js"></script>
</head>
<body data-page="catalog" data-root="./">
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="CyberPets home"><span class="wordmark-orbit" aria-hidden="true"></span>CYBER<span>PETS</span></a>
    <span class="header-note">THE LIVING AQUARIUM COLLECTION</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Explore the collection</p>
      <h1 id="page-title">Pick a world.<br><em>Meet its inhabitants.</em></h1>
      <p class="intro-copy">Open a card to see that edition in motion. These are previews only—nothing is sold or downloaded here.</p>
    </section>
    <section class="collection" aria-label="CyberPets preview collection">
      <div class="collection-heading"><h2>All editions</h2><span id="result-count" aria-live="polite"></span></div>
      <div class="filters" role="group" aria-label="Filter editions">
        <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-filter="bundle" aria-pressed="false">Bundles</button>
        <button class="filter" type="button" data-filter="tank" aria-pressed="false">Tanks</button>
        <button class="filter" type="button" data-filter="pet" aria-pressed="false">Creatures</button>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </section>
  </main>
  <footer class="site-footer"><span>CYBERPETS</span><span>Visual previews · No downloads on this site</span></footer>
</body>
</html>
